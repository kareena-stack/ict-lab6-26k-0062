<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <style>
       
        .card {
            width: 220px;
            border: 2px solid gray;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .card:hover {
            border-color: green;
        }

        
        .card img {
            width: 100%;
            height: 140px;
        }

        /* Price */
        .price {
            color:black;
            font-weight: bold;
            font-size: 18px;
            margin: 8px 0;
        }

        /* Buy Now Button */
        button {
            background-color: red;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        /* Button Hover Effect */
        button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMF01kPZzlgmnWlae9oNc3F5cetYTzko6Q9JXizTn2XQ&s" alt="digicam">
        <h2>digicam</h2>
        <p> use electronic sensors and lenses to capture pictures aesthetically.</p>
        <div class="price">$90.99</div>
        <button>Buy Now</button>
    </div>

</body>
</html>
