<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student List Table</title>
  <style>
    /* Basic Page Styling */
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
    }

    h2 {
      color: #333;
    }

    /* Table Styling */
    table {
      width: 100%;
      max-width: 600px;
      border-collapse: collapse; /* Merges borders into a single line */
      background-color: #ffffff;
    }

    /* Styling Table Headers and Data Cells */
    th, td {
      border: 1px solid #cccccc;
      padding: 10px 15px;
      text-align: left;
    }

    /* Header Styling */
    th {
      background-color:blue;
      color: white;
    }

    /* Alternate Row Colors for Better Readability */
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <h2>Student List</h2>

  <table>
    <!-- Table Header Row -->
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Grade</th>
        <th>Email</th>
      </tr>
    </thead>

    <!-- Table Body / Data Rows -->
    <tbody>
      <tr>
        <td>eisha </td>
        <td>15</td>
        <td>10th</td>
        <td>eisha@example.com</td>
      </tr>
      <tr>
        <td>nabiha</td>
        <td>16</td>
        <td>11th</td>
        <td>nabiha@example.com</td>
      </tr>
      <tr>
        <td>Charlie </td>
        <td>14</td>
        <td>9th</td>
        <td>charlie@example.com</td>
      </tr>
      <tr>
        <td>kareena</td>
        <td>17</td>
        <td>12th</td>
        <td>kareenaexample.com<td>
        </td>
      </tr>
    </tbody>
  </table>

</body>
</html>
