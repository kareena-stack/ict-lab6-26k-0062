<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
    <style>
        body.center-screen {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: digital getaway ; 
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            width: 280px;
            background-color: white;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
        }

       
        .login-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

      
        .login-box input[type="text"],
        .login-box input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

      
        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: dodgerblue;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            background-color:blue;
        }

        .forgot-link {
            display: block;
            margin-top: 15px;
            color: dodgerblue;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="center-screen">

    <!-- Main Box -->
    <div class="login-box">
        <h2>Login</h2>
        
        <form>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Submit</button>
        </form>

        <a href="#" class="forgot-link">Forgot Password?</a>
    </div>

</body>
</html>
