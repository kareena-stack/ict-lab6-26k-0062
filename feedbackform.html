<!DOCTYPE html>
<html>
<head>
  <title>Feedback Form</title>
  <style>
    /* Simple CSS Styling */
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    .form-box {
      width: 300px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    .rating {
      margin-top: 5px;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <div class="form-box">
    <h2>Feedback Form</h2>

    <form>
      <!-- Name Field -->
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Your Name" required>

      <!-- Email Field -->
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Your Email" required>

      <!-- Rating System -->
      <label>Rating:</label>
      <div class="rating">
        <input type="radio" id="star1" name="rating" value="1"> <label for="star1" style="display:inline;">1 Star</label><br>
        <input type="radio" id="star2" name="rating" value="2"> <label for="star2" style="display:inline;">2 Stars</label><br>
        <input type="radio" id="star3" name="rating" value="3"> <label for="star3" style="display:inline;">3 Stars</label><br>
        <input type="radio" id="star4" name="rating" value="4"> <label for="star4" style="display:inline;">4 Stars</label><br>
        <input type="radio" id="star5" name="rating" value="5"> <label for="star5" style="display:inline;">5 Stars</label>
      </div>

      <!-- Feedback Message -->
      <label for="message">Feedback:</label>
      <textarea id="message" rows="4" placeholder="Your feedback..."></textarea>

      <!-- Submit Button -->
      <button type="submit">Submit</button>
    </form>
  </div>

</body>
</html>
