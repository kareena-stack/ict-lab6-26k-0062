<!DOCTYPE html>
<html>
<head>
    <title>Simple Navigation Menu</title>
    <style>
        /* Menu background */
        ul.nav {
            list-style-type: none; /* Bullets hatane ke liye */
            margin: 0;
            padding: 0;
            background-color: #333; /* Dark background */
            overflow: hidden; /* Menu ko container me rakhne ke liye */
        }

        /* Menu items ko ek line (horizontal) me karne ke liye */
        ul.nav li {
            float: left; /* Items ko left se ek sath line me lane ke liye */
            width: 25%; /* Screen size ke hisab se 4 links barabar bat jayenge (Responsive) */
        }

        ul.nav li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 0px;
            text-decoration: none; /* Underline hatane ke liye */
        }

       
        ul.nav li a:hover {
            background-color: #04AA6D; /* Green color */
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Simple Navigation Menu -->
    <ul class="nav">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>

</body>
</html>
